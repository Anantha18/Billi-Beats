<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billi Beats</title>
<meta name="description" content="Pick a genre, build a band of desi cats, and share the track. Seven genres, 112 cats, and your own voice as a cat.">
<meta property="og:title" content="Billi Beats: build a band of desi cats">
<meta property="og:description" content="Gully Rap, Goa Techno, Desi Folk, Retro Filmy, Sufi Rock, Carnatic Fusion, Indie Pop. Tap cats, make a track, top the chart.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#170e33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Hind+Madurai:wght@400;600;700&display=swap" rel="stylesheet">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{
  /* layout: home is a stack of genre "gig poster" cards; the band page pins the stage on top and scrolls four two-cat shelves under it. Single dark theme; each genre tints the page through --g1/--g2. */
  --ink:#170e33; --panel:#2a1b57; --line:#4b3a8a; --chuna:#fff4dc; --muted:#c9bdf2;
  --haldi:#ffc21a; --rani:#ff3d86; --mor:#12c2b0;
  --g1:#ffc21a; --g2:#ff3d86;
  --display:'Baloo 2','Hind Madurai',system-ui,sans-serif;
  --body:'Hind Madurai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--chuna);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--chuna);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:900px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100%}

/* home */
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.9;margin:0;color:var(--haldi);letter-spacing:-.5px;text-shadow:3px 3px 0 var(--rani),6px 6px 0 var(--ink),7px 7px 0 var(--mor)}
.brand p{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:40ch}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;aspect-ratio:2.1/1;background:var(--panel);box-shadow:0 0 0 3px var(--g1),0 6px 0 3px var(--ink);text-align:left;display:block;width:100%}
.card:active{transform:translateY(2px)}
.card .bg{position:absolute;inset:0;width:100%;height:100%}
.card .trio{position:absolute;left:0;right:0;bottom:7%;height:78%;display:flex;justify-content:center;align-items:flex-end;gap:1%}
.card .trio svg{height:100%;width:auto;overflow:visible}
.card .lbl{position:absolute;left:10px;top:10px;background:var(--ink);border-radius:12px;padding:5px 12px 6px;display:flex;flex-direction:column;box-shadow:0 0 0 2px var(--g1)}
.card .lbl b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;color:var(--g1)}
.card .lbl i{font-style:normal;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.card .go{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--g1);color:var(--ink);display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.soonrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.pill{border:2px dashed var(--line);border-radius:999px;padding:5px 12px;font-size:13px}

/* band page */
.bar{display:flex;align-items:center;gap:10px}
.back{min-height:40px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;flex:0 0 auto}
.bar h2{font-family:var(--display);font-weight:800;font-size:clamp(20px,6.2vw,36px);line-height:1.05;margin:0;color:var(--g1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.dock{position:sticky;top:0;z-index:20;background:var(--ink);margin:0 -16px;padding:4px 16px 10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 14px -10px rgba(0,0,0,.7)}
.stage{position:relative;border-radius:16px;overflow:hidden;margin:6px;padding:16px 4px 8px;box-shadow:0 0 0 3px var(--g1),0 0 0 6px var(--g2)}
#stagebg{position:absolute;inset:0}
#stagebg .bg{width:100%;height:100%;display:block;transition:transform .12s ease-out;transform-origin:50% 100%}
.stage.beat #stagebg .bg{transform:scale(1.025)}
.lineup{position:relative;display:flex;justify-content:center}
.slot{position:relative;flex:0 0 14.28%;max-width:14.28%;display:flex;flex-direction:column;align-items:center}
.who{border:0;background:none;padding:0;width:100%;display:flex;flex-direction:column;align-items:center;border-radius:10px}
.bobw{display:block;width:100%;max-width:112px}
.slot.on .bobw{animation:bob 2.6s ease-in-out infinite}
.slot:nth-child(2n) .bobw{animation-delay:-.9s}.slot:nth-child(3n) .bobw{animation-delay:-1.7s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.slot.drop .who{background:rgba(255,244,220,.25)}
.nm{font-size:11px;font-weight:700;line-height:1.1;text-align:center;margin-top:2px;padding:2px 4px;border-radius:6px;color:var(--chuna);background:rgba(23,14,51,.8)}
.nm:empty{display:none}
.x{position:absolute;top:2px;right:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--chuna);color:var(--ink);font-size:13px;font-weight:700;line-height:1;padding:0;display:none}
.slot.on.muted .x,.slot.on:hover .x,.slot.on:focus-within .x{display:block}
.slot.muted .bobw{filter:grayscale(.85) brightness(.75)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:12px;background:rgba(23,14,51,.5)}
.banner.show{display:flex}
.banner b{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,60px);line-height:1;color:var(--haldi);transform:rotate(-4deg);text-shadow:3px 3px 0 var(--rani),6px 6px 0 var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.banner span{margin-top:10px;font-weight:700;background:var(--chuna);color:var(--ink);padding:4px 12px;border-radius:6px;font-size:14px}
@keyframes pop{from{transform:rotate(-4deg) scale(.3)}to{transform:rotate(-4deg) scale(1)}}

/* cats in motion */
.cs{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
.tx{filter:url(#tex)}
.playing .stage .tx{filter:none}
.cs .body{transform-origin:50px 152px;transition:transform .08s ease-out}
.hit .cs .body{transform:scale(1.045,.95)}
.cs .mo{display:none}.hit .cs .mo{display:block}.hit .cs .mc{display:none}
.cs .eye{transform-box:fill-box;transform-origin:center;transition:transform .06s}
.blk .cs .eye{transform:scaleY(.12)}
.cs .swing,.cs .pp,.cs .tail{transform-box:fill-box;transition:transform .1s}
.cs .swing{transform-origin:50% 100%}.cs .pp{transform-origin:0% 0%}.cs .tail{transform-origin:0% 100%;transition:transform .25s}
.hit .cs .swing{transform:rotate(-14deg)}.hit .cs .swing2{transform:rotate(14deg)}.hit .cs .pp{transform:scale(1.08)}
.q .cs.q-tail .tail{transform:rotate(-18deg)}
.q .cs.q-tilt{transform:rotate(6deg)}
.q .cs.q-hop{transform:translateY(-8px)}
.q .cs.q-yawn .mo{display:block}.q .cs.q-yawn .mc{display:none}.q .cs.q-yawn .eye{transform:scaleY(.35)}
.cheer .slot.on .cs{animation:jump .48s ease-in-out 4}
.cheer .slot:nth-child(2n) .cs{animation-delay:.12s}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px) rotate(-3deg)}}

/* controls */
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play{border:3px solid var(--ink);background:var(--g1);color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;padding:7px 22px;border-radius:999px;box-shadow:0 4px 0 var(--g2);min-width:112px}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}
.btn{min-height:40px;border:2px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:999px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--chuna)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.troph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tro{border:2px dashed var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-height:48px}
.tro .faces{display:flex;flex:0 0 auto}
.tro .faces svg{width:30px;height:30px;margin-left:-6px;border-radius:50%;background:var(--panel);overflow:hidden}
.tro .faces svg:first-child{margin-left:0}
.tro .faces.q i{width:26px;height:26px;margin-left:-6px;border-radius:50%;background:var(--ink);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--muted)}
.tro .faces.q i:first-child{margin-left:0}
.tro.got{border-style:solid;border-color:var(--haldi);background:var(--haldi);color:var(--ink);font-weight:700}

/* shelves */
.tray{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.tray{grid-template-columns:1fr 1fr;gap:12px 14px}}
.grp h2{margin:0 0 5px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--c)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{touch-action:manipulation;user-select:none;-webkit-user-select:none;border:2px solid var(--c);background:var(--panel);border-radius:14px;padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.chip svg{width:100%;max-width:66px;aspect-ratio:1;height:auto;overflow:hidden;transform:none;transition:none}
.chip span{font-size:11px;line-height:1.12;font-weight:600;text-align:center;overflow-wrap:break-word;max-width:100%;min-height:25px;display:flex;align-items:center}
.chip{position:relative}
.chip.on{box-shadow:0 0 0 3px var(--c),0 0 14px var(--c)}
.chip.on::after{content:'✓';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--ink);font-weight:800;font-size:12px;line-height:20px;text-align:center}
.chip.nudge{animation:nudge 1.1s ease-in-out infinite;border-color:var(--chuna)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(255,244,220,.75)}50%{box-shadow:0 0 0 7px rgba(255,244,220,0)}}
.ghost{position:fixed;z-index:50;pointer-events:none;width:64px;transform:translate(-50%,-60%)}

/* voice shelf */
.grp.you{grid-column:1/-1}
.yourow{display:flex;gap:10px;align-items:stretch}
.yourow .chip{flex:0 0 96px}
.youside{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.youside p{margin:0;font-size:13px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pillb{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.pillb[aria-pressed="true"]{background:var(--chuna);color:var(--ink);border-color:var(--chuna)}
.btn.sm{align-self:flex-start;padding:6px 11px;font-size:12.5px}
.btn.hot{background:var(--g1);color:var(--ink);border-color:var(--ink);font-weight:700;box-shadow:0 3px 0 var(--g2)}
.btn:disabled{opacity:.6}
.meter{height:14px;border-radius:999px;background:var(--ink);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--rani);border-radius:999px;transition:width .1s linear}
.meter.thin{height:6px}.meter.thin i{width:100%;background:var(--mor);transform-origin:0 50%;transform:scaleX(0);transition:transform .08s}
.pubbar{margin:0;font-size:13px;background:var(--panel);border:2px solid var(--g1);border-radius:12px;padding:7px 12px;color:var(--chuna)}
.pubbar b{color:var(--g1)}

/* chart */
.sech{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 8px;color:var(--haldi)}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 10px;text-align:left;width:100%;min-width:0}
.crow:hover{border-color:var(--chuna)}
.crow .rk{font-family:var(--display);font-weight:800;font-size:22px;color:var(--haldi);flex:0 0 24px;text-align:center}
.crow .faces{display:flex;flex:0 0 auto}
.crow .faces svg{width:32px;height:32px;margin-left:-8px;border-radius:50%;background:var(--ink);overflow:hidden;transform:none}
.crow .faces svg:first-child{margin-left:0}
.crow .cn{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .cn b{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.crow .cn i{font-style:normal;font-size:12px;color:var(--muted)}
.crow .pl{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--haldi);color:var(--ink);display:grid;place-items:center;font-size:12px}
.emptyc{margin:0;font-size:13.5px;color:var(--muted);border:2px dashed var(--line);border-radius:14px;padding:12px}

/* share sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,5,26,.82);display:none;align-items:center;justify-content:center;padding:16px}
.sheet.show{display:flex}
.pcard{background:var(--panel);border:3px solid var(--g1);border-radius:18px;max-width:420px;width:100%;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.poster{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1.6/1}
.poster .bg{position:absolute;inset:0;width:100%;height:100%}
.poster .cats{position:absolute;left:2%;right:2%;bottom:4%;height:88%;display:flex;justify-content:center;align-items:flex-end}
.poster .cats svg{height:100%;width:auto;flex:0 1 auto;min-width:0;transform:none}
.pcard h3{font-family:var(--display);font-weight:800;font-size:25px;margin:0;color:var(--g1);line-height:1.05;text-wrap:balance}
.pcard p{margin:0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--chuna);color:var(--ink);font-weight:700;padding:9px 14px;border-radius:999px;font-size:13.5px;display:none;max-width:calc(100% - 32px);box-shadow:0 4px 0 var(--rani)}
.toast.show{display:block}

@media(max-width:560px){
  .app{gap:10px;padding-top:10px}
  .stage{padding:12px 2px 4px}
  .slot .tx{filter:none}
  .nm{font-size:9.5px;padding:1px 2px}
  .x{width:26px;height:26px;font-size:12px;right:-4px;top:0}
  .ctl{gap:5px;flex-wrap:nowrap}
  .ctl button{flex:0 0 auto}
  .play{font-size:17px;padding:5px 14px;min-width:84px;min-height:40px;box-shadow:0 3px 0 var(--g2)}
  .btn{padding:6px 10px;font-size:12.5px}
  .hint{font-size:12px}
  .tro{font-size:10.5px;line-height:1.15;padding:5px 3px;min-height:42px;flex-direction:column;gap:2px;text-align:center}
  .tro .faces svg{width:26px;height:26px}
  .banner b{font-size:30px}.banner span{font-size:12px}
  .card .lbl b{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  .slot.on .bobw,.chip.nudge,.cheer .slot.on .cs,.banner b{animation:none}
  .cs,.cs .body,.cs .swing,.cs .pp,.cs .tail,#stagebg .bg{transition:none}
  .hit .cs .body,.stage.beat #stagebg .bg{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <main id="home">
    <header class="brand">
      <h1>Billi Beats</h1>
      <p>Pick a genre. Build a band of cats. Drop the track.</p>
    </header>
    <div class="cards" id="cards" style="margin-top:16px"></div>
    <section id="homechart" style="margin-top:22px" hidden>
      <h2 class="sech">Top bands this week</h2>
      <div class="clist" id="homelist"></div>
    </section>
  </main>

  <main id="band" hidden>
    <div class="bar">
      <button class="back" id="back">‹ Genres</button>
      <div style="flex:1;min-width:0"><h2 id="gtitle"></h2><p id="gtag"></p></div>
      <button class="back" id="top10">🏆 Top 10</button>
    </div>
    <div class="dock" style="margin-top:8px">
      <section class="stage" id="stage" aria-label="Band stage">
        <div id="stagebg"></div>
        <div class="lineup" id="lineup"></div>
        <canvas id="fx"></canvas>
        <div class="banner" id="banner" aria-live="polite"><b id="bn1"></b><span id="bn2"></span></div>
      </section>
      <div class="ctl">
        <button class="play" id="play" aria-pressed="false">Bajao</button>
        <button class="btn" id="shuf">Shuffle</button>
        <button class="btn" id="clr">Clear</button>
        <button class="btn" id="shr">Share</button>
      </div>
    </div>
    <p class="pubbar" id="pubbar" style="margin-top:10px" hidden></p>
    <p class="hint" id="hint" style="margin-top:10px"></p>
    <div class="troph" id="troph" aria-label="Secret combos" style="margin-top:10px"></div>
    <div class="tray" id="tray" style="margin-top:12px"></div>
  </main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="bandname">
  <div class="pcard">
    <div class="poster"><div id="sharebg"></div><div class="cats" id="sharecats"></div></div>
    <p id="sharegenre"></p>
    <h3 id="bandname" tabindex="-1"></h3>
    <div class="row">
      <button class="btn" id="rename">New name</button>
      <button class="btn hot" id="story">Story card</button>
      <button class="btn" id="copylink">Copy link</button>
    </div>
    <div class="row">
      <button class="btn hot" id="publish">Publish to chart</button>
      <button class="btn" id="closesheet">Close</button>
    </div>
    <p id="pubnote"></p>
  </div>
</div>
<div class="sheet" id="recsheet" role="dialog" aria-modal="true" aria-labelledby="rectitle">
  <div class="pcard">
    <h3 id="rectitle">Record your Billi</h3>
    <p id="recmsg" style="font-size:15px;color:var(--chuna)"></p>
    <div class="meter"><i id="recbar"></i></div>
    <div class="meter thin"><i id="reclvl"></i></div>
    <div class="row">
      <button class="btn hot" id="recgo">Start recording</button>
      <button class="btn" id="reccancel">Cancel</button>
    </div>
    <p>Your voice stays on this phone. It is never uploaded, and it is not part of links or the chart.</p>
  </div>
</div>
<div class="sheet" id="chartsheet" role="dialog" aria-modal="true" aria-labelledby="charttitle">
  <div class="pcard">
    <h3 id="charttitle"></h3>
    <div class="clist" id="chartlist"></div>
    <p>A listen counts once per phone, after 15 seconds of play. The chart resets every Monday.</p>
    <div class="row"><button class="btn" id="chartclose">Close</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="toastmsg"></span></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
